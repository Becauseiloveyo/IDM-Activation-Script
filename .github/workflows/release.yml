name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (must match VERSION, for example v2.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate release version
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG='${{ inputs.tag }}'
          else
            TAG="$GITHUB_REF_NAME"
          fi

          VERSION="$(tr -d '\r\n[:space:]' < VERSION)"
          EXPECTED_TAG="v${VERSION}"
          TOOLBOX_VERSION="$(sed -nE 's/^set "toolboxver=([^"]+)"$/\1/p' IDM-Toolbox.cmd | head -n 1 | tr -d '\r')"

          if [[ -z "$VERSION" || -z "$TOOLBOX_VERSION" ]]; then
            echo "Unable to resolve VERSION or toolboxver." >&2
            exit 1
          fi

          if [[ "$TOOLBOX_VERSION" != "$VERSION" ]]; then
            echo "VERSION=$VERSION but toolboxver=$TOOLBOX_VERSION" >&2
            exit 1
          fi

          if [[ "$TAG" != "$EXPECTED_TAG" ]]; then
            echo "Release tag must be $EXPECTED_TAG, got $TAG" >&2
            exit 1
          fi

          NOTES="RELEASE_NOTES_${TAG}.md"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          NOTES: ${{ steps.meta.outputs.notes }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi

          if [[ -f "$NOTES" ]]; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "IDM Toolbox $TAG" \
              --notes-file "$NOTES" \
              --latest
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "IDM Toolbox $TAG" \
              --generate-notes \
              --latest
          fi

          gh release upload "$TAG" "IDM-Toolbox.cmd#IDM-Toolbox.cmd" --clobber
